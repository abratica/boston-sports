name: probe-espn
on:
  push:
    branches: [probe-espn]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe-espn }
      - name: Fetch NFL game feed
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'}), timeout=30) as r: return json.load(r)
          os.makedirs('assets/api', exist_ok=True)
          base='https://site.api.espn.com/apis/site/v2/sports/football/nfl/'
          sb=get(base+'scoreboard?dates=20261101')
          ev=[e for e in sb['events'] if any(c['team']['abbreviation']=='NE' for c in e['competitions'][0]['competitors'])][0]
          json.dump(get(base+'summary?event='+ev['id']), open('assets/api/nfl_live.json','w'))
          print('ok', ev['id'])
          PY
      - name: Commit
        run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add assets && git commit -qm "probe nfl" && git push -q origin HEAD:probe-espn
