name: Fill box scores and videos
# Runs on GitHub's servers, so it can reach ESPN and YouTube directly. Adds any missing box score and
# highlight video to today's issue (see tools/fill_games.py), right after the morning issue lands and
# then every 20 minutes through midday.
on:
  push:
    branches: [main]
    paths: ["issues/**", "tools/fill_games.py", ".github/workflows/fill-games.yml"]
  schedule:
    - cron: "*/20 9-17 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: fill-games
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fill in missing box scores and videos
        run: python3 tools/fill_games.py
      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing to publish"; exit 0; fi
          git config user.name "PS Sports bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A issues games tools/fill_status.json
          git commit -m "Box scores and videos: $(python3 -c "import json;print(json.load(open('index.json'))['issues'][0]['date'])")"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          # Pushes made by this workflow don't trigger the Pages build on their own, so ask for one.
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
